name: Agent Window CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    paths:
      - "apps/agent-window/**"
      - "packs/**"
      - "config/**"
      - "policies/**"
      - "deploy/**"
      - ".dockerignore"
      - "package.json"
      - ".github/workflows/agent-window-ci.yml"
      - ".github/workflows/qa-pilot-image.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test capability and deployment policies
        run: npm run test --workspace @bm-agents-world/agent-window

      - name: Validate OPA policy
        run: >-
          docker run --rm
          -v "$PWD/policies/bm-agents-world:/policies:ro"
          openpolicyagent/opa:1.17.0
          check /policies/authorization.rego

      - name: Build application
        run: npm run build

      - name: Build pilot container image
        run: docker build --pull -f apps/agent-window/Dockerfile -t bm-agents-world:ci .
