apiVersion: bm-agents-world/v1
kind: ApprovedConnectorRegistry
metadata:
  owner: bm-agent-platform
  policy: deny-unregistered
connectors:
  - id: jira
    displayName: Jira Cloud
    kind: native-or-mcp
    status: approved
    systems: [jira]
    transports: [native-http, streamable-http]
    auth: server-secret-or-oauth-2.1
    allowedPacks: [qa]
    tools:
      - id: story.read
        capabilityIds: [qa.jira.story.read]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
      - id: bug.duplicate.search
        capabilityIds: [qa.jira.duplicate.search]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
      - id: bug.create
        capabilityIds: [qa.jira.bug.create]
        actionClass: external-write
        maxRisk: L3
        environments: [playground, qa, prod]
        approval: human
  - id: bitbucket
    displayName: Bitbucket
    kind: native-or-mcp
    status: approved
    systems: [bitbucket]
    transports: [native-http, streamable-http]
    auth: server-secret-or-workload-identity
    allowedPacks: [qa]
    tools:
      - id: change-impact.read
        capabilityIds: [qa.bitbucket.change-impact.read]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
  - id: playwright
    displayName: Playwright Browser Worker
    kind: native-or-mcp
    status: approved
    systems: [playwright]
    transports: [native-worker, stdio, streamable-http]
    auth: workload-identity
    allowedPacks: [qa]
    tools:
      - id: test.run
        capabilityIds: [qa.playwright.test.run]
        actionClass: test
        maxRisk: L1
        environments: [playground, qa]
  - id: qa-test-design
    displayName: QA Test Design
    kind: native
    status: approved
    systems: [qa]
    transports: [native-worker]
    auth: workload-identity
    allowedPacks: [qa]
    tools:
      - id: testplan.generate
        capabilityIds: [qa.testplan.generate]
        actionClass: read
        maxRisk: L0
        environments: [playground, qa, prod]
  - id: qa-api
    displayName: QA API Contract Checks
    kind: native
    status: approved
    systems: [api]
    transports: [native-http]
    auth: server-secret-or-workload-identity
    allowedPacks: [qa]
    tools:
      - id: contract.test
        capabilityIds: [qa.api.contract.test]
        actionClass: test
        maxRisk: L1
        environments: [playground, qa]
  - id: qa-integration
    displayName: QA Integration Traceability
    kind: native
    status: approved
    systems: [qa]
    transports: [native-worker]
    auth: workload-identity
    allowedPacks: [qa]
    tools:
      - id: integration.trace
        capabilityIds: [qa.integration.trace]
        actionClass: read
        maxRisk: L0
        environments: [playground, qa, prod]
  - id: qa-database
    displayName: QA Database Read Adapter
    kind: mcp
    status: approved
    systems: [database]
    transports: [streamable-http]
    auth: workload-identity
    allowedPacks: [qa]
    tools:
      - id: validation.read
        capabilityIds: [qa.database.validation.read]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
  - id: frontend-jira
    displayName: Jira Cloud (frontend-angular)
    kind: native-or-mcp
    status: approved
    systems: [jira]
    transports: [native-http, streamable-http]
    auth: server-secret-or-oauth-2.1
    allowedPacks: [frontend-angular]
    tools:
      - id: story.read
        capabilityIds: [frontend.jira.story.read]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
      - id: comment.post
        capabilityIds: [frontend.jira.comment.post]
        actionClass: external-write
        maxRisk: L3
        environments: [playground, qa]
        approval: human
  - id: frontend-bitbucket
    displayName: Bitbucket (frontend-angular)
    kind: native-or-mcp
    status: approved
    systems: [bitbucket]
    transports: [native-http, streamable-http]
    auth: server-secret-or-workload-identity
    allowedPacks: [frontend-angular]
    tools:
      - id: repository.context.read
        capabilityIds: [frontend.repository.context.read]
        actionClass: read
        maxRisk: L4
        environments: [playground, qa, prod]
      - id: pullrequest.create
        capabilityIds: [frontend.bitbucket.pullrequest.create]
        actionClass: external-write
        maxRisk: L3
        environments: [playground, qa]
        approval: human
  - id: frontend-design-system
    displayName: Design System Tokens
    kind: mcp
    status: pilot
    systems: [design]
    transports: [streamable-http]
    auth: oauth-2.1
    allowedPacks: [frontend-angular]
    tools:
      - id: tokens.read
        capabilityIds: [frontend.design.tokens.read]
        actionClass: read
        maxRisk: L0
        environments: [playground, qa, prod]
  - id: frontend-quality
    displayName: Frontend Quality Gates
    kind: native
    status: approved
    systems: [frontend]
    transports: [native-worker]
    auth: workload-identity
    allowedPacks: [frontend-angular]
    tools:
      - id: quality.gates.run
        capabilityIds: [frontend.quality.gates.run]
        actionClass: test
        maxRisk: L1
        environments: [playground, qa]
      - id: plan.generate
        capabilityIds: [frontend.plan.generate]
        actionClass: read
        maxRisk: L0
        environments: [playground, qa, prod]
  - id: teams
    displayName: Microsoft Teams
    kind: mcp
    status: pilot
    systems: [teams]
    transports: [streamable-http]
    auth: oauth-2.1
    allowedPacks: [qa]
    tools:
      - id: status.post
        capabilityIds: [qa.teams.status.post]
        actionClass: external-write
        maxRisk: L3
        environments: [playground, qa, prod]
        approval: human
