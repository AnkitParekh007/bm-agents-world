apiVersion: apps/v1
kind: Deployment
metadata:
  name: bm-agents-world
  namespace: bm-agents-world
  labels:
    app.kubernetes.io/name: bm-agents-world
    app.kubernetes.io/component: agent-window
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bm-agents-world
      app.kubernetes.io/component: agent-window
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bm-agents-world
        app.kubernetes.io/component: agent-window
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bm-agents-world
              app.kubernetes.io/component: agent-window
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: bm-agents-world
                    app.kubernetes.io/component: agent-window
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-window
          image: bm-agents-world:qa-pilot
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bm-agents-world-config
            - secretRef:
                name: bm-agents-world-secrets
                optional: true
          ports:
            - name: http
              containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: playwright-auth
              mountPath: /var/run/bm-secrets/playwright-auth
              readOnly: true
        - name: opa
          image: openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --log-format=json
            - /policies
          ports:
            - name: opa
              containerPort: 8181
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: opa
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: opa
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5
          volumeMounts:
            - name: opa-policy
              mountPath: /policies
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: playwright-auth
          secret:
            secretName: bm-agents-world-playwright-auth
            optional: true
        - name: opa-policy
          configMap:
            name: bm-agents-world-opa-policy
