apiVersion: engineering-manager-technical-lead-agent-pack/v1
kind: SecretReferenceRegistry
metadata:
  name: engineering-leadership-secret-references-template
spec:
  rules:
  - Never store secret values in this file.
  - The model receives capability names, never secret values.
  - Trusted adapters use workload identity and short-lived credentials.
  references:
  - id: atlassian-connector
    provider: replace-with-vault
    path: ref://engineering-leadership/atlassian
    consumer: atlassian-work-management
  - id: bitbucket-connector
    provider: replace-with-vault
    path: ref://engineering-leadership/bitbucket
    consumer: bitbucket-engineering
  - id: teams-connector
    provider: replace-with-vault
    path: ref://engineering-leadership/teams
    consumer: microsoft-teams
  - id: observability-reader
    provider: replace-with-vault
    path: ref://engineering-leadership/observability-read
    consumer: observability
  - id: people-context-reader
    provider: replace-with-vault
    path: ref://engineering-leadership/people-safe-read
    consumer: people-safe-context
    conditions:
    - purpose-bound
    - human-manager-initiated
    - minimum-necessary
    - audited
