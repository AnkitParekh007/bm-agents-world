apiVersion: solution-architect-agent-pack/v1
kind: AgentWorkflow
metadata:
  name: integration-and-data-design
  title: Integration and Data Architecture
  version: 1.0.0
spec:
  trigger:
  - new_integration
  - api_change
  - event_contract
  - data_contract
  - cross_system_flow
  objective: Define governed synchronous, asynchronous, and data contracts with ownership, evolution, security,
    observability, and test strategy.
  supervisor: solution-architect-supervisor
  execution:
    mode: stateful
    defaultPolicy: deny
    evidenceRequired: true
    approvalBinding: payload-hash
    resumeFromCheckpoint: true
  stages:
  - id: scope
    agent: business-product-context
    skills:
    - architecture.jira-context
    - architecture.scope-boundary
    - architecture.stakeholder-map
    gate: authorization
  - id: inventory
    agent: current-state-discovery
    skills:
    - architecture.integration-inventory
    - architecture.data-store-inventory
    - architecture.dependency-graph
  - id: domain-and-ownership
    agent: domain-boundary
    skills:
    - architecture.data-ownership
    - architecture.capability-map
  - id: integration-design
    agent: integration-api-architecture
    skills:
    - architecture.integration-pattern-selection
    - architecture.openapi-contract
    - architecture.asyncapi-contract
    - architecture.api-versioning
    - architecture.event-versioning
  - id: data-design
    agent: data-architecture
    skills:
    - architecture.consistency-model
    - architecture.data-lineage
    - architecture.data-lifecycle
    - architecture.data-migration-strategy
  - id: security-review
    agent: security-architecture
    skills:
    - architecture.data-flow-diagram
    - architecture.architecture-risk-register
  - id: test-and-observability
    agent: observability-operability
    skills:
    - architecture.contract-testing-strategy
    - architecture.acceptance-evidence-plan
  - id: consumer-producer-review
    agent: architecture-review
    skills:
    - architecture.atam-review
    - architecture.evidence-quality-check
    gate: publish-integration-contract
  - id: handoff
    agent: implementation-alignment
    skills:
    - architecture.implementation-slice-plan
    - architecture.conformance-checklist
    - architecture.team-handoff
  outputs:
  - integration-contract
  - data-flow-diagram
  - data-ownership-map
  - contract-test-plan
  - implementation-handoff
  terminalStates:
  - completed
  - rejected
  - blocked
  - cancelled
