apiVersion: solution-architect-agent-pack/v1
kind: AgentWorkflow
metadata:
  name: modernization-and-migration
  title: Modernization and Migration Architecture
  version: 1.0.0
spec:
  trigger:
  - legacy_modernization
  - framework_upgrade
  - platform_migration
  - data_migration
  - decommission_request
  objective: Create a reversible transition architecture and phased modernization plan with explicit compatibility,
    cutover, rollback, and decommission controls.
  supervisor: solution-architect-supervisor
  execution:
    mode: stateful
    defaultPolicy: deny
    evidenceRequired: true
    approvalBinding: payload-hash
    resumeFromCheckpoint: true
  stages:
  - id: authorize-and-inventory
    agent: current-state-discovery
    skills:
    - architecture.change-history-analysis
    - architecture.dependency-graph
    - architecture.legacy-risk-profile
    gate: authorization
  - id: assess
    agent: migration-modernization
    skills:
    - architecture.modernization-assessment
    - architecture.option-comparison
    - architecture.architecture-risk-register
  - id: target-and-transition
    agent: migration-modernization
    skills:
    - architecture.strangler-plan
    - architecture.transition-architecture
    - architecture.version-upgrade-roadmap
  - id: data-and-integration
    agent: data-architecture
    skills:
    - architecture.data-migration-strategy
    - architecture.data-lineage
    - architecture.consistency-model
    parallelWith:
    - integration-api-architecture
  - id: integration-contracts
    agent: integration-api-architecture
    skills:
    - architecture.api-versioning
    - architecture.event-versioning
    - architecture.contract-testing-strategy
  - id: operational-plan
    agent: reliability-resilience
    skills:
    - architecture.migration-rehearsal
    - architecture.cutover-plan
    - architecture.rollback-plan
  - id: cross-cutting-review
    agent: architecture-review
    skills:
    - architecture.atam-review
    - architecture.evidence-quality-check
    parallelDelegates:
    - security-architecture
    - performance-scalability
    - cost-sustainability
    - observability-operability
  - id: decision-and-roadmap
    agent: decision-governance
    skills:
    - architecture.adr-authoring
    - architecture.executive-architecture-summary
    gate: publish-architecture-decision
  - id: implementation-handoff
    agent: implementation-alignment
    skills:
    - architecture.implementation-slice-plan
    - architecture.test-strategy-alignment
    - architecture.conformance-checklist
    - architecture.decommission-plan
  outputs:
  - current-state-assessment
  - target-architecture
  - transition-architecture
  - migration-roadmap
  - cutover-and-rollback-plan
  - architecture-decision-record
  terminalStates:
  - completed
  - rejected
  - blocked
  - cancelled
