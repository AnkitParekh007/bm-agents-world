apiVersion: solution-architect-agent-pack/v1
kind: SecretReferenceRegistry
metadata:
  name: <project>-solution-architect-secret-references
  version: 1.0.0
spec:
  rules:
  - Store only references and metadata in this file.
  - Never place secret values, passwords, tokens, private keys, or connection strings here.
  - Inject credentials inside trusted adapters using workload identity or short-lived leases.
  references:
  - id: <reference-id>
    provider: <google-secret-manager|azure-key-vault|hashicorp-vault|enterprise-vault>
    path: <provider-resource-reference>
    consumer: <trusted-adapter-id>
    allowedProjects:
    - <project-id>
    allowedEnvironments:
    - <environment-id>
    allowedOperations:
    - read-resource
    leaseTtl: <short-duration>
    rotationOwner: <team>
    classification: restricted
