version: 1.0.0
rules:
- Never place secret values in this file
- Use opaque vault paths and workload identity only
- Grant per-project and per-environment capabilities
- Do not expose raw credentials to the model
references:
- id: atlassian-product-owner
  vault_ref: vault://product-owner/{project}/{environment}/atlassian
  consumer: atlassian-rovo-mcp
- id: bitbucket-product-owner
  vault_ref: vault://product-owner/{project}/{environment}/bitbucket
  consumer: bitbucket-context-mcp
- id: analytics-product-owner
  vault_ref: vault://product-owner/{project}/{environment}/analytics
  consumer: analytics-mcp
- id: teams-product-owner
  vault_ref: vault://product-owner/{project}/{environment}/teams
  consumer: teams-mcp
- id: artifact-store-product-owner
  vault_ref: vault://product-owner/{project}/{environment}/artifacts
  consumer: artifact-store-mcp
