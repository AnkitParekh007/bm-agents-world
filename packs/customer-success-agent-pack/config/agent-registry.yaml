version: 1.0.0
supervisor: customer-success-supervisor
agents:
- id: customer-success-supervisor
  description: Coordinates bounded customer-success work, account context, lifecycle orchestration, approvals, evidence,
    and cross-functional handoffs.
  capabilities:
  - orchestration
  - customer-success
  - risk
  - evidence
  status: enabled
  external_writes: approval-controlled
- id: work-context-agent
  description: Reads approved CRM, CS platform, Jira, Confluence, support, release, incident, usage, and account
    history.
  capabilities:
  - context
  - traceability
  - account-360
  status: enabled
  external_writes: approval-controlled
- id: customer-profile-agent
  description: Resolves customer lifecycle, segment, products, entitlements, service model, goals, and account metadata.
  capabilities:
  - customer-profile
  - segmentation
  - lifecycle
  status: enabled
  external_writes: approval-controlled
- id: stakeholder-map-agent
  description: Maintains approved relationship maps and identifies sponsor, champion, administrator, and decision-maker
    changes.
  capabilities:
