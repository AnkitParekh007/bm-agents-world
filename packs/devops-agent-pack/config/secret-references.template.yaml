version: 1.0.0
references:
- id: atlassian-capability
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/atlassian
  exposure: adapter-only
  rotation: dynamic-or-90d
- id: bitbucket-read
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/bitbucket-read
  exposure: adapter-only
  rotation: dynamic-preferred
- id: bitbucket-publisher
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/bitbucket-write
  exposure: adapter-only
  rotation: dynamic-preferred
- id: cloud-catalog-reader
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/cloud-read
  exposure: adapter-only
  rotation: workload-identity
- id: sandbox-operator
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/sandbox-operator
  exposure: adapter-only
  rotation: short-lived
- id: kubernetes-reader
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/kubernetes-read
  exposure: adapter-only
  rotation: short-lived
- id: observability-reader
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/observability-read
  exposure: adapter-only
  rotation: short-lived
- id: registry-promoter
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/registry-promote
  exposure: adapter-only
  rotation: short-lived
- id: signing-service
  provider: <SIGNING_SERVICE>
  path: <KEY_REFERENCE>
  exposure: remote-sign-only
  rotation: managed
- id: artifact-store
  provider: <VAULT_PROVIDER>
  path: <VAULT_PATH>/devops/artifact-store
  exposure: adapter-only
  rotation: dynamic-preferred
