version: 1.0.0
projects:
- id: pcc
  name: PCC
  applications:
  - Angular 12 frontend
  - Java services
  repositories:
  - <PCC_APP_REPOSITORIES>
  - <PCC_PLATFORM_REPOSITORIES>
  cicd: <PCC_CICD_SYSTEM>
  iac: <PCC_IAC_TOOL_AND_REPOSITORIES>
  runtime: <PCC_RUNTIME_PROFILE>
  cloud_targets:
  - <PCC_CLOUD_OR_ON_PREM_TARGETS>
  clusters:
  - <PCC_CLUSTERS>
  mode: legacy-compatible
  notes: Resolve pinned runtimes and deployment constraints before change.
