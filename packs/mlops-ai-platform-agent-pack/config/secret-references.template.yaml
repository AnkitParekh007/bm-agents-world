principle: No raw secret values in agent context. Trusted adapters resolve short-lived
  credentials.
references:
- name: mlflow
  ref: vaultref://mlops/{project}/{environment}/mlflow
- name: kubernetes
  ref: workloadidentity://mlops/{project}/{environment}/cluster-read
- name: model_provider
  ref: vaultref://mlops/{project}/{environment}/model-gateway
- name: registry
  ref: workloadidentity://mlops/{project}/{environment}/registry
- name: artifact_store
  ref: workloadidentity://mlops/{project}/{environment}/artifact-store
