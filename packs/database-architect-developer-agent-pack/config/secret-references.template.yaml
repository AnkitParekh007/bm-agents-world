version: 1.0.0
references:
- id: catalog-reader
  uri: vault://database/{project}/{environment}/catalog-reader
  exposure: adapter-only
  ttl: 15m
- id: diagnostic-reader
  uri: vault://database/{project}/{environment}/diagnostic-reader
  exposure: adapter-only
  ttl: 10m
- id: sandbox-owner
  uri: workload-identity://database-sandbox/{run-id}
  exposure: adapter-only
  ttl: run
- id: nonprod-migration-executor
  uri: vault://database/{project}/{environment}/migration-executor
  exposure: adapter-only
  ttl: 15m
  approval_required: true
- id: production-verifier
  uri: vault://database/{project}/production/verifier
  exposure: adapter-only
  ttl: 5m
  read_only: true
never_store:
- passwords
- connection-strings
- private-keys
- encryption-keys
- superuser-credentials
