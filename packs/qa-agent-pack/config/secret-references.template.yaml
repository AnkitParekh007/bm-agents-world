apiVersion: qa-agent-pack/v1
kind: SecretReferenceRegistry
# Store references and metadata only. Never commit secret values.
provider: gcp-secret-manager # gcp-secret-manager | azure-key-vault | hashicorp-vault | enterprise-vault
references:
  - id: jira-reader
    path: qa-agent/<org>/<project>/<environment>/jira/reader/oauth
    principal: qa-jira-reader
    rotationDays: 30
  - id: bitbucket-reader
    path: qa-agent/<org>/<project>/<environment>/bitbucket/reader/token
    principal: qa-bitbucket-reader
    rotationDays: 30
  - id: browser-test-user
    path: qa-agent/<org>/<project>/<environment>/product/browser-user
    principal: qa-browser-<project>-<environment>
    rotationDays: 14
  - id: postgres-readonly
    path: qa-agent/<org>/<project>/<environment>/postgres/readonly
    principal: qa-db-reader-<project>-<environment>
    dynamic: true
    ttlMinutes: 30
