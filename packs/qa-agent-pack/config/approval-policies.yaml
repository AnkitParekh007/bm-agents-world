apiVersion: qa-agent-pack/v1
kind: ApprovalPolicies
levels:
  L0:
    description: scoped read
    humanApproval: false
  L1:
    description: approved test execution
    humanApproval: workflow-or-standing-policy
  L2:
    description: controlled test mutation
    humanApproval: true
  L3:
    description: external organizational write
    humanApproval: true
  L4:
    description: production or high-impact change
    humanApproval: privileged-process
rules:
  - match: { action: jira.write }
    level: L3
  - match: { action: bitbucket.write }
    level: L3
  - match: { action: teams.post }
    level: L3
  - match: { action: database.write }
    effect: deny
  - match: { environment: prod, actionClass: mutation }
    effect: deny
  - match: { environment: prod, actionClass: read }
    level: L4
