apiVersion: java-developer-agent-pack/v1
kind: SecretReferenceRegistry
references:
- id: bitbucket-service-token
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: bitbucket-adapter
  environments:
  - playground
  - qa
  valueIncluded: false
- id: private-maven-repository
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: maven-adapter
  environments:
  - sandbox
  - playground
  - qa
  valueIncluded: false
- id: database-readonly
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: database-adapter
  environments:
  - playground
  - qa
  - prod
  valueIncluded: false
- id: messaging-observer
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: messaging-adapter
  environments:
  - playground
  - qa
  - prod
  valueIncluded: false
- id: observability-reader
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: jfr-observability-adapter
  environments:
  - playground
  - qa
  - prod
  valueIncluded: false
- id: artifact-registry-read
  provider: REPLACE_VAULT
  path: REPLACE
  adapter: container-adapter
  environments:
  - sandbox
  - playground
  - qa
  valueIncluded: false
forbiddenForAutonomousAgent:
- production-database-writer
- production-deployer
- artifact-signing-private-key
- production-broker-admin
