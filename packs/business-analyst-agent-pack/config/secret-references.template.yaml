apiVersion: business-analyst-agent-pack/v1
kind: SecretReferences
metadata:
  name: business-analysis-secret-references
spec:
  rule: References only. Never store values in this file or model context.
  references:
  - id: jira-workload-identity
    provider: vault-or-cloud-secret-manager
    path: replace/project/env/jira
    consumer: atlassian-rovo
    lease: short-lived
  - id: confluence-workload-identity
    provider: vault-or-cloud-secret-manager
    path: replace/project/env/confluence
    consumer: atlassian-rovo
    lease: short-lived
  - id: readonly-data-identity
    provider: vault-dynamic-credentials
    path: replace/project/env/database-readonly
    consumer: database-query
    lease: short-lived
  - id: artifact-service-identity
    provider: workload-identity
    path: replace/project/env/artifacts
    consumer: artifact-service
    lease: short-lived
