id: "llm-rag-system-implementation"
name: LLM / RAG System Implementation
trigger: approved generative AI design
steps:
  - "('source-governance', 'data-governance-agent', ['ai-ml.data-governance.purpose-limitation', 'ai-ml.data-governance.dataset-access-control'])"
  - "('rag-design', 'rag-knowledge-agent', ['ai-ml.rag.document-ingestion', 'ai-ml.rag.retrieval-access-control'])"
  - "('prompt-tool-design', 'llm-genai-agent', ['ai-ml.llm-genai.system-prompt-versioning', 'ai-ml.llm-genai.tool-contract-design'])"
  - "('integration', 'integration-agent', ['ai-ml.integration.tool-api-contracts', 'ai-ml.integration.timeout-retry-design'])"
  - "('evaluate', 'evaluation-agent', ['ai-ml.evaluation.llm-rubric-design', 'ai-ml.evaluation.judge-calibration'])"
  - "('security', 'ai-security-agent', ['ai-ml.ai-security.prompt-injection-testing', 'ai-ml.ai-security.retrieval-poisoning-analysis'])"
  - "('independent-review', 'independent-review-agent', ['ai-ml.governance.independent-review-routing'])"
outputs:
  - "rag-design"
  - "prompt-specification"
  - "rag-evaluation-report"
  - "threat-model"
  - "evaluation-report"
