principle: Never expose raw credentials to the language model. Store only logical references.
references:
  - id: "model-provider-dev"
    provider: "enterprise-vault"
    path_ref: "ai-ml/<project>/development/model-provider"
    consumer: "trusted-model-provider-adapter"
  - id: "experiment-tracker"
    provider: "enterprise-vault"
    path_ref: "ai-ml/<project>/experiment-tracker"
    consumer: "experiment-tracking-adapter"
  - id: "registry-access"
    provider: "enterprise-vault"
    path_ref: "ai-ml/<project>/model-registry"
    consumer: "model-registry-adapter"
  - id: "production-observability"
    provider: "enterprise-vault"
    path_ref: "ai-ml/<project>/production-observability-readonly"
    consumer: "observability-adapter"
