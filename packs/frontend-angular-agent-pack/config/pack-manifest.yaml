apiVersion: frontend-angular-agent-pack/v1
kind: AgentPack
metadata:
  name: frontend-angular-agent-pack
  version: 1.0.0
  owner: frontend-platform
spec:
  supervisor: frontend-angular-supervisor
  projects:
  - PCC
  - SOP
  - DataBridge
  environments:
  - local
  - playground
  - qa
  - prod
  registries:
    agents: agent-registry.yaml
    skills: skill-registry.yaml
    mcpServers: mcp-registry.yaml
    plugins: plugin-registry.yaml
    projects: project-registry.yaml
    policies: approval-policies.yaml
  defaultPolicy:
    production: read-only-and-privileged-approval
    externalWrites: explicit-human-approval
    mergeAndDeploy: deny
    secretValuesVisibleToModel: false
    packagePublication: deny
