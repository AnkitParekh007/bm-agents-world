apiVersion: frontend-angular-agent-pack/v1
kind: SecretReferenceRegistry
# Store references and metadata only. Never commit secret values.
provider: gcp-secret-manager # gcp-secret-manager | azure-key-vault | hashicorp-vault | enterprise-vault
references:
  - id: jira-reader
    path: frontend-agent/<org>/<project>/<environment>/jira/reader/oauth
    principal: frontend-jira-reader
    rotationDays: 30
  - id: jira-writer
    path: frontend-agent/<org>/<project>/<environment>/jira/writer/oauth
    principal: frontend-jira-writer
    rotationDays: 30
    approvalRequired: true
  - id: bitbucket-reader
    path: frontend-agent/<org>/<project>/<environment>/bitbucket/reader/token
    principal: frontend-bitbucket-reader
    rotationDays: 30
  - id: bitbucket-branch-writer
    path: frontend-agent/<org>/<project>/<environment>/bitbucket/branch-writer/token
    principal: frontend-bitbucket-writer-<project>
    rotationDays: 14
    approvalRequired: true
  - id: package-registry-reader
    path: frontend-agent/<org>/<project>/<environment>/npm/reader/token
    principal: frontend-package-reader-<project>
    rotationDays: 14
  - id: figma-reader
    path: frontend-agent/<org>/<project>/<environment>/figma/reader/oauth
    principal: frontend-figma-reader
    rotationDays: 30
  - id: browser-test-user
    path: frontend-agent/<org>/<project>/<environment>/product/browser-user
    principal: frontend-browser-<project>-<environment>
    rotationDays: 14
  - id: sonar-reader
    path: frontend-agent/<org>/<project>/<environment>/sonarqube/reader/token
    principal: frontend-sonar-reader
    rotationDays: 30
