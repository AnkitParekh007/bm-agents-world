- id: bm-agent-foundry
  name: BM Agent Foundry
  product_owner: ${BMAF_PRODUCT_OWNER}
  scrum_teams:
  - ${BMAF_PLATFORM_TEAM}
  repositories:
  - ${BMAF_REPOSITORIES}
