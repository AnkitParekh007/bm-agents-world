  environments:
  - playground
  - qa
  - production
- id: databridge
  name: DataBridge
  product_owner: ${DATABRIDGE_PRODUCT_OWNER}
  scrum_teams:
  - ${DATABRIDGE_TEAM_1}
  repositories:
  - ${DATABRIDGE_ANGULARJS_REPO}
  - ${DATABRIDGE_JAVA_REPO}
  delivery: scrum-or-flow-based-maintenance
  environments:
  - playground
  - qa
