version: 1.0.0
supervisor: release-manager-supervisor
agent_count: 27
agents:
- id: release-manager-supervisor
  description: Coordinates release intake, planning, readiness, approvals, deployment orchestration, communications,
    validation, closure, and evidence.
  capabilities:
  - orchestration
  - release-management
  - governance
  status: enabled
  external_writes: approval-controlled
- id: release-context-agent
  description: Retrieves approved product, Jira, repository, artifact, environment, service, calendar, change, test,
    and operational context.
  capabilities:
  - context
  - traceability
  - service-catalog
  status: enabled
  external_writes: approval-controlled
- id: release-intake-agent
  description: Qualifies release requests, release type, accountable owners, environments, windows, and missing
    information.
  capabilities:
  - intake
  - classification
  - routing
  status: enabled
  external_writes: approval-controlled
- id: scope-and-version-agent
  description: Builds exact release scope, version maps, fix-version alignment, artifact identity, and release bill
    of materials.
  capabilities:
  - scope
  - versioning
  - manifest
  status: enabled
  external_writes: approval-controlled
- id: release-calendar-agent
  description: Coordinates release windows, freezes, blackout periods, sequencing, milestones, and timezone-safe
    calendars.
  capabilities:
  - calendar
  - scheduling
  - coordination
  status: enabled
  external_writes: approval-controlled
- id: dependency-coordination-agent
  description: Maps service, team, data, infrastructure, vendor, consumer, and sequencing dependencies.
  capabilities:
  - dependencies
  - compatibility
  - coordination
  status: enabled
  external_writes: approval-controlled
- id: quality-evidence-agent
