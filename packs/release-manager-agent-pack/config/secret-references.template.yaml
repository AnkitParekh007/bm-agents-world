version: 1.0.0
rule: Store references and identities only; never put raw secret values in this file.
references:
- id: atlassian-release-context
  provider: vault-or-cloud-secret-manager
  purpose: Jira, Confluence, and change-context adapter
  mode: workload-identity-or-short-lived-token
- id: bitbucket-release-read
  provider: vault-or-cloud-secret-manager
  purpose: Repository, tags, commits, and pull-request metadata
  mode: short-lived-read-token
- id: pipeline-release-orchestrator
  provider: vault-or-cloud-secret-manager
  purpose: Deterministic pipeline invocation after approval
  mode: short-lived-capability-lease
- id: artifact-registry-release
  provider: vault-or-cloud-secret-manager
  purpose: Artifact metadata and approved promotion
  mode: workload-identity
- id: observability-release-read
  provider: vault-or-cloud-secret-manager
  purpose: Bounded redacted telemetry queries
  mode: workload-identity
- id: database-migration-read
  provider: vault-or-cloud-secret-manager
  purpose: Migration status and approved read-only validation
  mode: dynamic-read-only-credential
- id: teams-release-publisher
  provider: vault-or-cloud-secret-manager
  purpose: Approved release communication
  mode: short-lived-payload-bound-token
