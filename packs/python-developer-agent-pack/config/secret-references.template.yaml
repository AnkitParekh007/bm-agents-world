apiVersion: python-developer-agent-pack/v1
kind: SecretReferenceRegistry
references:
- id: bitbucket-read
  uri: vault://python-agents/shared/bitbucket-read
  operations:
  - repository.read
  - pr.read
  - pipeline.read
  ttl: 15m
- id: bitbucket-approved-write
  uri: vault://python-agents/shared/bitbucket-write
  operations:
  - commit
  - push
  - pr.create
  ttl: 5m
  approvalRequired: true
- id: database-diagnostic
  uri: vault://python-agents/PROJECT/ENV/database-diagnostic
  operations:
  - schema.read
  - select.bounded
  - explain
  ttl: 10m
- id: package-index-read
  uri: vault://python-agents/shared/package-index-read
  operations:
  - package.metadata
  - package.download-approved
  ttl: 15m
- id: observability-read
  uri: vault://python-agents/PROJECT/ENV/observability-read
  operations:
  - logs.read
  - metrics.read
  - traces.read
  ttl: 10m
rules:
- No raw values in configuration
- Adapters resolve references after policy approval
- Production write credentials are not available to the agent runtime
