apiVersion: integration-api-architect-agent-pack/v1
kind: SecretReferenceTemplate
metadata:
  name: integration-api-secret-references
spec:
  rules:
  - Never store secret values in this file.
  - Use workload identity where possible.
  - Issue short-lived capability leases.
  - Pass secrets only inside trusted adapters.
  references:
  - id: bitbucket
    provider: <vault>
    path: <secret-reference>
    purpose: repository adapter
  - id: gateway
    provider: <vault>
    path: <secret-reference>
    purpose: approved gateway adapter
  - id: broker
    provider: <vault>
    path: <secret-reference>
    purpose: approved broker adapter
  - id: idp
    provider: <vault>
    path: <secret-reference>
    purpose: identity metadata/approved changes
  - id: partner
    provider: <vault>
    path: <secret-reference>
    purpose: partner integration adapter
