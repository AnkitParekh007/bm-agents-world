version: 1.0.0
environments:
- id: authoring-sandbox
  classification: isolated
  allowed_actions:
  - draft
  - build
  - lint
  - render
  - test-samples
  data: synthetic-or-approved-source-only
- id: playground
  classification: nonproduction
  allowed_actions:
  - read
  - approved-screenshot
  - approved-procedure-validation
  writes: bounded-synthetic-only
- id: qa
  classification: nonproduction-shared
  allowed_actions:
  - read
  - approved-screenshot
  - approved-procedure-validation
  writes: approval-controlled
- id: production
  classification: production
  allowed_actions:
  - bounded-redacted-read
  writes: prohibited-for-free-form-agent
