- id: artifact-and-evidence-mcp
  description: Store versioned drafts, previews, review reports, manifests, and immutable evidence bundles.
  mode: mixed
  credentials: workload-identity-or-vault-reference
  status: template
- id: vault-capability-mcp
  description: Provides short-lived connector capabilities to trusted adapters without exposing secrets to the model.
  mode: broker-only
  credentials: workload-identity-or-vault-reference
  status: template
- id: policy-and-approval-mcp
  description: Evaluates OPA policy and obtains payload-bound approval for protected publication actions.
  mode: control-plane
  credentials: workload-identity-or-vault-reference
  status: template
